syntax = "proto3";

import "draw-something.proto";

option java_package = "com.soul.im.protos";
option java_multiple_files = true;
option go_package = "protos";
option objc_class_prefix = "IMP";

message SauthMessage {
  string soulId = 1;
  string uid = 2;
  string sid = 3;
  ClientType clientType = 4;
  string clientVersion = 5;
  string deviceId = 6;
  string deviceVendor = 7;
  string deviceModel = 8;
  string deviceOsName = 9;
  string deviceOsVersion = 10;
  bool isRetrying = 11;
  Label label = 12;
}

message Label {
  enum Business {
    DEFAULT_BUSINESS = 0;
    IM = 1;
    GAME = 2;
  }
  enum ChannelType {
    DEFAULT_CHANNEL_TYPE = 0;
    SOULAPP = 1;
    WECHAT = 2;
    FACEBOOK = 3;
  }
  Label.Business business = 1;
  Label.ChannelType channelType = 2;
}

message CommandMessage {
  enum Type {
    MSG = 0;
    SYNC = 1;
    PSH = 2;
    ACK = 3;
    FIN = 4;
    RESP = 5;
    NOTIFY = 6;
    PUSH = 7;
    SYNC_FIN = 8;
    MSG_FIN = 9;
    FIRST_SYNC = 10;
    TRANS_CMD = 11;
    REPORT = 12;
    ORDER = 13;
    CHAT_ROOM = 14;
    MAP = 15;
    ROAM = 16;
    GROUP = 17;
  }
  string soulId = 1;
  string cmd_id = 2;
  CommandMessage.Type type = 3;
  string acceptedMsgId = 4;
  ClientType clientType = 18;
  string crc = 19;
  string encryptedUserId = 20;
  int64 timestamp = 25;
  oneof cmd {
    MsgCommand msgCommand = 5;
    RespCommand respCommand = 6;
    PshCommand pshCommand = 7;
    AckCommand ackCommand = 8;
    SyncCommand syncCommand = 9;
    FinCommand finCommand = 10;
    NotifyCommand notifyCommand = 11;
    PushMessage pushMessage = 12;
    SyncFin syncFin = 13;
    MsgFin msgFin = 14;
    TransCommand transCommand = 15;
    ReportCommand reportCommand = 16;
    OrderCommand orderCommand = 17;
    ChatRoomCommand chatRoomCommand = 21;
    MapCommand mapCommand = 23;
    RoamCommand roamCommand = 24;
    GroupCommand groupCommand = 26;
  }
}

message CommandGroup {
  repeated CommandMessage commands = 1;
}

message OrderCommand {
  enum Type {
    KICKOUT = 0;
    DELETE = 1;
  }
  OrderCommand.Type type = 1;
  oneof order {
    KickoutOrderCommand kickoutOrderCommand = 2;
    DeleteOrderCommand DeleteOrderCommand = 3;
  }
}

message KickoutOrderCommand {
  string userId = 1;
  ClientType kicker = 2;
  ClientType asser = 3;
  string timestamp = 4;
}

message DeleteOrderCommand {
  string userId = 1;
  repeated DeleteItemOrderCommand deleteItem = 2;
}

message DeleteItemOrderCommand {
  string msg_from = 1;
  string msg_to = 2;
  string cmd_id = 3;
}

message ReportCommand {
  enum Type {
    LOGIN_REPORT = 0;
    RELATION_REPORT = 3;
  }
  ReportCommand.Type type = 1;
  oneof report {
    LoginReportCommand loginReportCommand = 2;
    RelationReportCommand relationReportCommand = 4;
  }
}

message LoginReportCommand {
  enum LoginType {
    CONNECT = 0;
    DISCONNECT = 1;
    LOGIN = 2;
    LOGOUT = 3;
    VICE_LOGOUT = 4;
  }
  LoginReportCommand.LoginType loginType = 1;
  ClientType clientType = 2;
  string from = 3;
  string to = 4;
  string timestamp = 5;
  string deviceId = 6;
  repeated string viceId = 7;
}

message RelationReportCommand {
  string masterId = 1;
  repeated string viceId = 2;
  repeated string deleteMasterId = 3;
  repeated string deleteViceId = 4;
}

message PshCommand {
  enum Type {
    SYNC = 0;
    KICK = 1;
  }
  PshCommand.Type type = 1;
  string errorMsg = 2;
}

message AckCommand {
  enum Type {
    MSG = 0;
    SYNC = 1;
  }
  bool remain = 1;
  string readLastMsgId = 2;
  string timestamp = 3;
  AckCommand.Type type = 4;
}

message SyncCommand {
  enum Type {
    SINGLECHAT = 0;
    ROOMCHAT = 1;
    ROAMINGCHAT = 2;
    VICE_UNREAD = 3;
  }
  string startMsgId = 1;
  string endMsgId = 2;
  string startTimestamp = 3;
  string endTimestamp = 4;
  bool withFrom = 5;
  SyncCommand.Type type = 6;
  string roomId = 7;
  string roamUserId = 8;
  string requestId = 9;
  repeated string viceId = 10;
}

message FinCommand {
  oneof cmd {
    SyncFin syncFin = 1;
    MsgFin msgFin = 2;
  }
}

message SyncFin {
  string readLastMsgId = 1;
  string timestamp = 2;
}

message MsgFin {
  enum Status {
    TODO = 0;
    DOING = 1;
    DONE = 2;
  }
  string readLastMsgId = 1;
  string timestamp = 2;
  MsgFin.Status status = 3;
}

